# Packaging. Build the Windows installer on Windows: npm installs the Claude Code binary for
# the machine it runs on, and the installer must ship the Windows one.
appId: dev.clyde.app
productName: Clyde
copyright: Copyright © 2026
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - package.json
  - '!**/*.map'
  - '!**/*.{md,markdown}'
  - '!**/{test,tests,__tests__}/**'
# Executables and native modules cannot run from inside app.asar.
asarUnpack:
  - node_modules/node-pty/**
  - node_modules/better-sqlite3/**
  - node_modules/@vscode/ripgrep/**
  - node_modules/@anthropic-ai/claude-agent-sdk-*/**
# node-pty and better-sqlite3 ship N-API prebuilds that load in Electron as is.
npmRebuild: false
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: resources/icon.png
# One click, per user: no admin rights, no questions, shortcuts on the desktop and in the Start
# menu, and Clyde starts when the install ends. Data in %APPDATA%\Clyde survives uninstalls.
nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Clyde
  artifactName: Clyde-Setup-${version}.exe
  deleteAppDataOnUninstall: false
# A single exe that runs without installing: it unpacks itself to a temporary folder at each
# start, and keeps its data in Clyde-data next to the exe (see src/main/index.ts).
portable:
  artifactName: Clyde-${version}-portable.exe
  splashImage: resources/portable-splash.bmp
mac:
  target: dmg
  category: public.app-category.developer-tools
linux:
  target: [AppImage]
  category: Development
  # npm can install both Claude Code builds on Linux; glibc distributions need only one.
  files:
    - '!node_modules/@anthropic-ai/claude-agent-sdk-linux-*-musl/**'
