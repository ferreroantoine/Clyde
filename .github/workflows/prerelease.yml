# Builds the Windows installer and publishes it as a GitHub pre-release when a tag like
# v0.2.0-beta.1 is pushed. The installer is built on Windows: npm installs the Claude Code
# binary of the machine it runs on.
name: Pre-release

on:
  push:
    tags: ['v*-*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm test

      # A personal build: subscription accounts stay available (see README, distribution builds).
      - run: npx electron-vite build
      - run: npx electron-builder --win --x64 --publish never

      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          name: Atelier ${{ github.ref_name }}
          body_path: docs/RELEASE-NOTES.md
          files: release/*.exe
          fail_on_unmatched_files: true
